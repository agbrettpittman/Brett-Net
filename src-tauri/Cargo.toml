[package]
name = "brett-net"
version = "0.1.0"
description = "Network monitoring toolkit"
authors = ["Brett Pittman"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "brett_net_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
