[package]
name = "brett-net"
version = "0.1.0"
description = "Network monitoring toolkit"
authors = ["Brett Pittman"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "brett_net_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# `bundled` compiles SQLite from source, so there is no system dependency for
# coworkers to install and no version drift between machines.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-updater = "2.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  # IcmpSendEcho2 is gated behind this feature in windows-rs.
  "Win32_System_IO",
  # GetLocalTime, for local-time filenames on exports.
  "Win32_System_SystemInformation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
